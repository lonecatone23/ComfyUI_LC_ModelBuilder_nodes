[project]
name = "ComfyUI_LC_ModelBuilder_nodes"
version = "0.2.0"
description = "ComfyUI LC Modelbuilder Nodes by lonecatone23 — checkpoint/model merging tools. Starts with LC Krea2 Block Merge Advanced (per-block ratio curve + named-region sliders, reuses ComfyUI's own block-merge patching), checkpoint savers, and LC Face Variety Scorer (same-face test with InsightFace buffalo_l via onnxruntime). Companion to ComfyUI_LC123_nodes; separate Registry name."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "lonecatone23" }]
keywords = [
  "comfyui", "custom-nodes", "model-merging", "checkpoint-merge", "krea2",
  "block-merge", "lonecat", "lc-modelbuilder", "face-variety", "same-face",
]

[project.urls]
Repository = "https://github.com/lonecatone23/ComfyUI_LC_ModelBuilder_nodes"
Homepage = "https://github.com/lonecatone23/ComfyUI_LC_ModelBuilder_nodes"
"Buy me a coffee" = "https://ko-fi.com/lonecatone"

[tool.comfy]
PublisherId = "lonecatone23"
DisplayName = "ComfyUI LC Modelbuilder Nodes"
Icon = ""
